        <div class="media-gallery">
          <figure><img src="assets/greedy_mesh_showcase.png" alt="Voxel terrain with bright green outlines showing visible voxel faces combined by greedy meshing"><figcaption>Green outlines show exposed voxel faces combined by greedy meshing. Hidden faces are omitted from the rendered surface.</figcaption></figure>
        </div>

      <section class="project-content">
        <div>
          <h2>Overview</h2>
          <div class="project-description">
            <p>A chunked procedural terrain system in Roblox Studio, built from voxels generated with layered Perlin noise. The showcase shows the voxel faces exposed to air: hidden faces are not rendered, and binary greedy meshing combines visible faces to reduce the rendered geometry.</p>
          </div>

          <h2>Chunk handling</h2>
          <div class="project-description">
            <p>Chunks can be loaded and unloaded as the world expands. The terrain is voxel-based, but its current heightmap approach does not generate filled voxels above the heightmap. Extending it to do so would be needed for fully volumetric terrain in every direction.</p>
            <p>To handle neighbors generated at different times, the system stores chunk-boundary occupancy in flat 2D buffers so face visibility can still be checked when adjacent chunks appear later.</p>
          </div>

          <h2>Data and meshing</h2>
          <div class="project-description">
            <p>Material data is stored in a flat 3D buffer; a smaller occupancy buffer packs voxel occupancy into 32-bit integers. Bitwise operations check visibility across voxel rows, so faces hidden against neighboring voxels can be omitted. Binary greedy meshing combines the remaining exposed faces while adding little computation.</p>
          </div>

          <h2>Tradeoffs</h2>
          <div class="project-description">
            <p>Roblox’s instance-based rendering cannot merge faces with different materials into one instance. The chunk is therefore meshed once for each material it contains.</p>
          </div>
        </div>
        <aside class="project-aside"><h2>Built with</h2><p>Roblox Studio &middot; Procedural generation</p></aside>
      </section>

      <section class="project-content">
        <div>
          <h2>Overview</h2>
          <div class="project-description">
            <p>A Roblox Studio flocking simulation with obstacle avoidance, server and client simulation, and replicated state. Clients simulate boids locally and use server updates to correct their motion.</p>
          </div>

          <h2>Technical approach</h2>
          <div class="project-description">
            <p>Sparse spatial chunks partition the boids into groups that parallel jobs can update. The simulation runs separately from rendering, so each can use its own update rate.</p>
            <p>When a chunk is especially dense, a job subdivides it and aggregates subcell data. Boids can use those aggregates instead of evaluating every nearby boid, reducing update times in typical dense cases.</p>
            <p>Three LOD systems independently control simulation, network replication, and rendering. Distant groups can therefore use fewer client and server resources, allowing larger swarms overall.</p>
          </div>

          <h2>Data structures</h2>
          <div class="project-description">
            <p>Boids move between chunks frequently, so I built a buffer-backed page system to store them. Lazy deletion keeps boids stable in their pages and avoids frequent registry updates. Bit-packed dead-slot buffers help find available slots for incoming or moving boids.</p>
            <p>Small pages can be removed from mostly inactive chunks to limit memory use. Boid data is quantized in buffers to reduce the amount copied across Actor boundaries when parallel jobs run.</p>
          </div>

          <h2>Results and tradeoffs</h2>
          <div class="project-description">
            <p>The project has demonstrated a 20,000-boid simulation on an iPhone 15.</p>
            <p>Dense-chunk subdivision improves typical update cost, but the worst case remains O(n²). The simulation runs on the CPU.</p>
          </div>
        </div>
        <aside class="project-aside"><h2>Built with</h2><p>Roblox Studio &middot; Simulation &middot; Networking</p></aside>
