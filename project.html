            Your browser does not support embedded video. <a href="assets/boids_demo.mp4">Open the video file</a>.

        <div class="media-gallery">
          <!-- Add figures here when project screenshots or videos are available. -->

      <section class="project-content">
        <div>
          <h2>About the project</h2>
          <div class="project-description">
            <p>A boids simulation implemented in Roblox Studio, including obstacle avoidance, client simulations, and server simulations which are replicated to all clients. Clients run a simulation simultaneously, using replication data from the server to course correct individual boids. Unfortunately since it's Roblox, the entire simulation is run on the cpu.</p>
            <p>The boids use sparse chunking to partition them, which are used by jobs that get scheduled to calculate updates in parallel. The simulation layer is separated from the rendering layer, so that the simulation can run at a different framerate than the rendering. Additionally, if a cell is particularly dense during a job, it will do a pass through the boids first to partition them into subcells, and then during that simulation step the boids will use aggregate subcell data instead of evaluating all the boid's in that dense cell near them. This drastically reduces dense cell update times in most cases, despite not improving the worst case of O(n^2)</p>
            <p>There are 3 separate LOD systems, one for the simulation, one for the network replication, and one for the rendering. This means that a boid group far away from a client has very little effect on the client's performance, lessens the server's load dramatically if nobody is observing those boids, and allows for much larger swarms overall.</p>
            <p>I've achieved a 20000 boid simulation running on my iphone 15 with no network or frame lag.</p>
          </div>
        </div>
        <aside class="project-aside"><h2>Built with</h2><p>Roblox Studio &middot; Simulation &middot; Networking</p></aside>
      </section>
